# Keeps the prerendered article pages in step with what Fred has published.
#
# The pages under p/ are generated from Supabase, so publishing a piece
# through the site's own editor does not create its static page — this does,
# on a schedule, so nobody has to remember. It also runs when index.html
# changes, because that file is the shell every generated page is built from.
#
# It never runs on a push to p/, sitemap.xml or robots.txt, which are the only
# paths it writes, so its own commit cannot trigger it again.

name: Prerender article pages

on:
  schedule:
    - cron: '17 */6 * * *'     # four times a day, off the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tools/build-static.mjs'

concurrency:
  group: prerender
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate
        run: node tools/build-static.mjs

      - name: Commit anything that changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prerender article pages

          Generated by .github/workflows/prerender.yml from the pieces
          published at the time of the run."
          git push
